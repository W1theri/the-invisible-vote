en:{participant:'Participant',researcher:'Researcher workspace',live:'Live experiment',offline:'OFFLINE STUDY',welcomeTag:'A study of digital decisions',hero:'A small choice.<br>A bigger <span class="accent-text">question.</span>',subtitle:'How independent are your digital decisions?',intro:'Take part in a short university study about decision-making in digital interfaces. Participation is voluntary and anonymous. Some details of the method will be explained after voting.',consent:'I am taking part voluntarily. I understand that some study details are explained afterwards and I can withdraw my response.',start:'Start Experiment',duration:'About 2 minutes',anonymous:'No personal data collected',specTitle:'One decision.<br>Three moments.',step1:'Choose',step1desc:'Consider two university improvements.',step2:'Reflect',step2desc:'Tell us about your decision.',step3:'Discover',step3desc:'Explore the study and its questions.',specNote:'PHILOSOPHY × DIGITAL LIFE',studyType:'UNIVERSITY RESEARCH PROJECT',localOnly:'Stored in this browser only. No device synchronization.',researchAccess:'Researcher access',voteTitle:'What should our university improve first?',voteSub:'Choose one option. Your vote will be locked when selected.',library:'University Library',lounge:'Student Lounge',libraryDesc:'Better study spaces, more books and improved academic resources.',loungeDesc:'More comfortable spaces for relaxation, communication and student activities.',select:'Choose this option',option:'OPTION',popular:'Popular choice',progress1:'Decision',progress2:'Reflection',progress3:'Explanation',exit:'Withdraw & see explanation',locked:'One anonymous response per session.',surveyTitle:'A moment to reflect.',surveySub:'Your vote has been recorded. Please answer the two required questions below.',q1:'Did you notice anything in the interface that might have influenced your choice?',yes:'Yes',no:'No',unsure:'Not sure',q2:'How confident are you that your decision was independent?',low:'Not confi  you confirm a decision.',overview:'Overview',method:'Study notes',sessions:'Session controls',backStudy:'Return to participant',dashTitle:'The choice, in numbers.',dashSub:'A local view of completed, anonymous responses.',realData:'Real Data',demoData:'Demo Data',realBadge:'REAL RESPONSES · LOCAL',demoBadge:'SYNTHETIC DATA · NOT RESEARCH FINDINGS',realNote:'Completed surveys only. Export a backup before clearing browser data.',demoNote:'Illustrative synthetic participants. Kept separate from real responses and exports.',total:'Total Participants',groupA:'Group A Participants',groupB:'Group B Participants',libraryVotes:'Library Votes',loungeVotes:'Student Lounge Votes',abTitle:'Library choice rate by group',abSub:'Same question. Different visual treatment.',difference:'Difference · B minus A',pp:'pp',awarenessTitle:'Did they notice an influence?',awarenessSub:'Self-reported awareness by group',confidenceTitle:'Confidence in independence',confidenceSub:'Mean score on a scale of 1–5',distributionTitle:'Voting distribution',distributionSub:'Votes and shares within each group',noData:'No completed responses yet.',noGroup:'No data',responses:'Participant responses',id:'Anonymous ID',group:'Group',choice:'Selected option',awareness:'Awareness',confidence:'Confidence',reason:'Optional reason',refresh:'Refresh Results',csv:'Export CSV',json:'Export JSON Backup',import:'Import JSON Backup',clear:'Clear Data',generate:'Generate 40 Demo Participants',resetDemo:'Reset Demo Data',pending:'unfinished vote(s) excluded',interpretLabel:'READING THE RESULT',noComparison:'Complete at least one response in each group to compare rates.',interpret:'These are preliminary observations from a teaching study. A difference in proportions alone does not establish an interface effect or statistical significance.',similar:'The observed rates are close (less than 5 percentage points apart). This sample shows little descriptive separation; it does not establish the absence of an effect.',equal:'Both groups have the same observed library choice rate. This does not establish the absence of an effect.',positive:'The observed library choice rate is higher in Group B.',negative:'The observed library choice rate is lower in Group B.',demoInterpret:'Synthetic illustration only; no inference about real participants is possible.',refreshed:'Results refreshed.',exported:'Export created.',emptyExport:'No completed responses to export.',generated:'40 synthetic participants generated. Real responses were not changed.',reset:'Synthetic dataset cleared.',cleared:'Selected dataset cleared.',deleteTitle:'Delete your response?',deleteBody:'This removes your vote and survey from this browser. Previously exported copies on other devices cannot be removed here.',confirm:'Confirm',cancel:'Cancel',clearTitle:'Clear the selected dataset?',clearBody:'This removes all records in the selected dataset on this browser. Export a backup first if you need to keep them.',generateTitle:'Replace demo participants?',generateBody:'This replaces the current synthetic dataset with 40 new synthetic records. Real data is not changed.',next:'Start a new anonymous session',sessionTitle:'Ready for the next participant.',sessionIntro:'Use one device in sequence. End the previous participant’s session before handing over the screen.',newSessionBody:'This ends the current participant session. A locked vote without a submitted survey will be discarded. Completed responses remain in the dataset. The next participant cannot withdraw the previous person’s response.',testTitle:'Preview both interfaces',testDesc:'Choose a test version. Test votes never enter the real or demo dataset. Exit the test using Researcher access after the explanation.',testA:'Test Group A',testB:'Test Group B',nextDesc:'Random allocation resumes automatically for real participants. Researcher-selected groups are only available in isolated tests.',testBanner:'RESEARCHER TEST · response will not be saved',started:'New participant session ready.',exitTitle:'Withdraw from the study?',exitBody:'Your local vote will be deleted. You will see the full explanation of the experiment.',studyNotesTitle:'A question about autonomy.',methodIntro:'Social problem: university students may not notice how digital interfaces shape decisions they experience as independent.',researchQuestion:'To what extent can interface design influence the decisions students perceive as autonomous?',designTitle:'Experimental design',designText:'Random allocation favors the smaller assigned group; ties are resolved randomly. Allocation counts persist in this browser. Abandonment and withdrawal can still unbalance completed group sizes. A uses equal cards and buttons; B highlights only the library card, its button, and a social cue. Position and wording remain fixed. This combined treatment cannot isolate the contribution of each design feature.',ethicsTitle:'Consent, care & interpretation',ethicsText:'Participation is voluntary; the task is a low-risk hypothetical university preference. No names, emails or IP addresses are collected. The consent notice discloses temporary withholding of details. The debrief explains the unverified popularity cue. Participants may withdraw locally before the next session. Ask no one to enter personal details in free text.',questionsTitle:'Questions for ethical reflection',ethic1:'How ethical is it to influence participants through interface design?',ethic2:'Can users give meaningful consent when some methodological details are temporarily withheld?',ethic3:'How should digital platforms balance persuasion and individual autonomy?',limitationsTitle:'Local prototype limitations',limitationsText:'This dashboard is not a synchronized multi-device poll. File-based browser storage varies across browsers and file locations. Clearing browser data can delete results. This workspace has no password; use a supervised device. A local anonymous session cannot verify unique people. Exported backups must be handled responsibly.',liveTag:'LIVE EXPERIMENT',liveTitle:'How independent<br>was our choice?',liveSub:'One question. Two interfaces. A shared reflection on autonomy.',liveParticipants:'COMPLETED PARTICIPANTS',liveQuote:'Autonomy begins with noticing the conditions of our choices.',liveAttribution:'Project proposition · inspired by Kant and Foucault',reveal:'Reveal Experiment',liveReveal:'WHAT IF YOUR CHOICE WAS NEVER TRULY YOURS?',liveExplain:'The same question was shown with two designs. Group B highlighted the library and included an unverified “Popular choice” cue. The comparison invites reflection; it cannot prove what caused anyone’s decision.',back:'Back to results',fullscreen:'Full screen',leaveFullscreen:'Exit full screen',backDashboard:'Dashboard',storageFailure:'Persistent storage is unavailable or full. Changes are currently kept in memory only. Export a JSON backup now and keep this tab open.',corrupt:'Saved data could not be read safely. Imports and changes are paused to protect it. Export a recovery copy, then use Clear Data in each affected dataset to recover.',recovery:'Export recovery copy',importInvalid:'Invalid backup. Expected this app’s version-1 JSON with one labeled dataset and valid, unique completed records (maximum 10,000).',importTitle:'Import backup?',importBody:'The labeled dataset in this file will replace the matching local dataset. The other dataset is unchanged. Current participant access to a previous response will end. Export a backup first.',imported:'Backup imported. Matching dataset replaced.',fileTooLarge:'Backup is too large (maximum 10 MB).',unavailable:'This response is no longer available. Ask the researcher to start a new session.',savingFailed:'Could not save this change. Please export a recovery copy.',participants:'participants',privacy:'Anonymous · voluntary · local',noPersonal:'Please do not include personal information.',sessionActive:'An unfinished session is ready to continue.',resume:'Continue session',withdrawnTag:'RESPONSE WITHDRAWN',ownNotFound:'Your response is no longer in this dataset.',testEnded:'Test ended.',footerProject:'Philosophy end-term project',liveNoData:'No comparison yet. Collect completed responses in both groups.',backupSource:'Dataset',dataProtected:'Saved data needs recovery before this action.',percentOf:'of',completed:'completed',clearTest:'Leave test / new real session'},
ru:{participant:'Участник',researcher:'Панель исследователя',live:'Эксперимент на экране',offline:'ОФЛАЙН-ИССЛЕДОВАНИЕ',welcomeTag:'Исследование цифровых решений',hero:'Маленький выбор.<br>Большой <span class="accent-text">вопрос.</span>',subtitle:'Насколько независимы ваши цифровые решения?',intro:'Примите участие в коротком университетском исследовании принятия решений в цифровых интерфейсах. Участие добровольное и анонимное. Некоторые подробности методики будут объяснены после голосования.',consent:'Я участвую добровольно. Я понимаю, что некоторые детали исследования объяснят позже, и могу удалить свой ответ.',start:'Начать эксперимент',duration:'Около 2 минут',anonymous:'Без сбора личных данных',specTitle:'Одно решение.<br>Три момента.',step1:'Выберите',step1desc:'Рассмотрите два улучшения университета.',step2:'Подумайте',step2desc:'Расскажите о своём решении.',step3:'Узнайте',step3desc:'Познакомьтесь с идеей исследования.',specNote:'ФИЛОСОФИЯ × ЦИФРОВАЯ ЖИЗНЬ',studyType:'УНИВЕРСИТЕТСКИЙ ПРОЕКТ',localOnly:'Данные только в этом браузере. Синхронизации нет.',researchAccess:'Вход для исследователя',voteTitle:'Что нашему университету стоит улучшить в первую очередь?',voteSub:'Выберите один вариант. После выбора изменить голос будет нельзя.',library:'Университетская библиотека',lounge:'Студенческая зона отдыха',libraryDesc:'Более удобные места для учёбы, больше книг и улучшенные академические ресурсы.',loungeDesc:'Более комфортные пространства для отдыха, общения и студенческих мероприятий.',select:'Выбрать этот вариант',option:'ВАРИАНТ',popular:'Популярный выбор',progress1:'Решение',progress2:'Размышление',progress3:'Объяснение',exit:'Отозвать ответ и узнать методику',locked:'Один анонимный ответ за сессию.',surveyTitle:'Момент для размышления.',surveySub:'Ваш голос записан. Ответьте на два обязательных вопроса ниже.',q1:'Заметили ли вы в интерфейсе что-либо, что могло повлиять на ваш выбор?',yes:'Да',no:'Нет',unsure:'Не уверен(а)',q2:'Насколько вы уверены, что ваше решение было независимым?',low:'Не уверен(а)',high:'Полностью уверен(а)',q3:'Какова главная причина вашего выбора?',optional:'Необязательно · до 500 символов. Не вводите имена и личные данные.',reasonPlaceholder:'Что было для вас важнее всего?',submit:'Отправить ответы',required:'Ответьте на оба обязательных вопроса.',revealTag:'КАК УСТРОЕН ЭКСПЕРИМЕНТ',revealTitle:'Вы сделали выбор.<br>Что на него повлияло?',revealIntro:'Вы участвовали в эксперименте о цифровой архитектуре выбора.',revealBody:'Есть два интерфейса голосования: в группе A оба варианта оформлены одинаково. В группе B библиотека выделена цветом, контрастной кнопкой и подсказкой «Популярный выбор». Вопрос и описания не меняются. Эти различия могли повлиять на решения, но сами по себе не доказывают, что ваш выбор был результатом манипуляции.',cue:'Подсказка «Популярный выбор» — элемент эксперимента, а не проверенная статистика популярности.',kant:'КАНТ · АВТОНОМИЯ',kantText:'Автономия побуждает нас задуматься, основано ли суждение на собственных доводах. Выделенная кнопка ставит вопрос о независимости решения, но не раскрывает внутреннюю свободу человека.',foucault:'ФУКО · ВЛАСТЬ',foucaultText:'Власть может действовать через повседневное устройство среды, делая одни действия заметнее или проще других. Интерфейс помогает рассмотреть эти тонкие условия выбора.',endQuestion:'Был ли этот выбор действительно вашим?',deleteOwn:'Удалить мой ответ',deleted:'Ваш ответ удалён из локального набора данных.',saved:'Завершённый ответ хранится только в этом браузере. Вы можете удалить его ниже до начала сессии следующего участника.',testSaved:'Это тест исследователя. Ответ не добавлен ни в один набор данных.',guide:'Памятка цифровой свободы',tip1:'Сделайте паузу, прежде чем следовать выделенной рекомендации.',tip2:'Сравните формулировки и заметность всех вариантов.',tip3:'Проверяйте подсказки «популярно» и «рекомендуем».',tip4:'Ищите скрытые альтернативы и малозаметные кнопки отказа.',tip5:'Сформулируйте собственные доводы перед подтверждением решения.',overview:'Обзор',method:'Об исследовании',sessions:'Управление сессиями',backStudy:'Вернуться к участнику',dashTitle:'Выбор в цифрах.',dashSub:'Локальные результаты завершённых анонимных анкет.',realData:'Реальные данные',demoData:'Демоданные',realBadge:'РЕАЛЬНЫЕ ОТВЕТЫ · ЛОКАЛЬНО',demoBadge:'СИНТЕТИЧЕСКИЕ ДАННЫЕ · НЕ РЕЗУЛЬТАТЫ ИССЛЕДОВАНИЯ',realNote:'Только завершённые анкеты. Экспортируйте копию перед очисткой данных браузера.',demoNote:'Искусственные участники для демонстрации. Хранятся и экспортируются отдельно от реальных ответов.',total:'Всего участников',groupA:'Участников группы A',groupB:'Участников группы B',libraryVotes:'Голосов за библиотеку',loungeVotes:'Голосов за зону отдыха',abTitle:'Доля выбора библиотеки по группам',abSub:'Один вопрос. Разное оформление.',difference:'Разница · B минус A',pp:'п. п.',awarenessTitle:'Заметили ли влияние?',awarenessSub:'Осознанность влияния по самоотчёту',confidenceTitle:'Уверенность в независимости',confidenceSub:'Среднее значение по шкале от 1 до 5',distributionTitle:'Распределение голосов',distributionSub:'Голоса и доли внутри каждой группы',noData:'Завершённых ответов пока нет.',noGroup:'Нет данных',responses:'Ответы участников',id:'Анонимный ID',group:'Группа',choice:'Выбор',awareness:'Осознанность',confidence:'Уверенность',reason:'Причина (необязательно)',refresh:'Обновить результаты',csv:'Экспорт CSV',json:'Резервная копия JSON',import:'Импорт копии JSON',clear:'Очистить данные',generate:'Создать 40 демоучастников',resetDemo:'Удалить демоданные',pending:'незавершённых голосов исключено',interpretLabel:'КАК ЧИТАТЬ РЕЗУЛЬТАТ',noComparison:'Для сравнения нужен хотя бы один завершённый ответ в каждой группе.',interpret:'Это предварительные наблюдения учебного исследования. Разница долей сама по себе не доказывает влияние интерфейса или статистическую значимость.',similar:'Наблюдаемые доли близки (разница менее 5 процентных пунктов). В этой выборке различие невелико; это не доказывает отсутствия эффекта.',equal:'В обеих группах одинакова наблюдаемая доля выбора библиотеки. Это не доказывает отсутствия эффекта.',positive:'В группе B наблюдаемая доля выбора библиотеки выше.',negative:'В группе B наблюдаемая доля выбора библиотеки ниже.',demoInterpret:'Только синтетическая иллюстрация; выводы о реальных участниках невозможны.',refreshed:'Результаты обновлены.',exported:'Файл экспорта создан.',emptyExport:'Нет завершённых ответов для экспорта.',generated:'Создано 40 синтетических участников. Реальные ответы не изменены.',reset:'Демоданные удалены.',cleared:'Выбранный набор данных очищен.',deleteTitle:'Удалить ваш ответ?',deleteBody:'Голос и анкета будут удалены из этого браузера. Ранее экспортированные копии на других устройствах удалить отсюда нельзя.',confirm:'Подтвердить',cancel:'Отмена',clearTitle:'Очистить выбранный набор данных?',clearBody:'Все записи выбранного набора будут удалены из этого браузера. Сначала экспортируйте резервную копию, если они вам нужны.',generateTitle:'Заменить демоучастников?',generateBody:'Текущие демоданные будут заменены 40 новыми синтетическими записями. Реальные ответы не изменятся.',next:'Новая анонимная сессия',sessionTitle:'Всё готово для следующего участника.',sessionIntro:'Передавайте одно устройство по очереди. Завершайте предыдущую сессию до передачи экрана.',newSessionBody:'Текущая сессия завершится. Голос без отправленной анкеты будет удалён. Завершённые ответы сохранятся. Следующий участник не сможет отозвать ответ предыдущего.',testTitle:'Проверка двух интерфейсов',testDesc:'Выберите тестовую версию. Тестовые голоса не попадают в реальные или демонстрационные данные. После объяснения вернитесь через вход для исследователя.',testA:'Тест группы A',testB:'Тест группы B',nextDesc:'Для реальных участников группа снова будет назначаться автоматически. Ручной выбор группы доступен только в изолированном тесте.',testBanner:'ТЕСТ ИССЛЕДОВАТЕЛЯ · ответ не будет сохранён',started:'Новая сессия участника готова.',exitTitle:'Прекратить участие?',exitBody:'Ваш локальный голос будет удалён. Вы увидите полное объяснение эксперимента.',studyNotesTitle:'Вопрос об автономии.',methodIntro:'Социальная проблема: студенты университета могут не замечать, как цифровые интерфейсы влияют на решения, которые они считают независимыми.',researchQuestion:'В какой мере дизайн интерфейса влияет на решения, которые студенты воспринимают как автономные?',designTitle:'Дизайн эксперимента',designText:'Случайное распределение отдаёт приоритет группе с меньшим числом назначений; при равенстве группа выбирается случайно. Счётчики сохраняются в браузере. Незавершённые анкеты и удаление ответов могут нарушить баланс завершённых групп. В A карточки и кнопки равны; в B выделяются карточка библиотеки, её кнопка и социальная подсказка. Порядок и текст фиксированы. Комплексное воздействие не позволяет разделить вклад отдельных элементов.',ethicsTitle:'Согласие, забота и интерпретация',ethicsText:'Участие добровольное; задача — гипотетический выбор улучшения университета с низким риском. Имена, email и IP-адреса не собираются. Согласие предупреждает об отсроченном объяснении части методики. После анкеты раскрывается непроверенный характер подсказки популярности. Ответ можно отозвать локально до следующей сессии. В свободном тексте не следует указывать личные данные.',questionsTitle:'Вопросы этической рефлексии',ethic1:'Насколько этично влиять на участников через дизайн интерфейса?',ethic2:'Возможно ли осмысленное согласие, если часть методики временно скрыта?',ethic3:'Как цифровым платформам совместить убеждение и автономию личности?',limitationsTitle:'Ограничения локального прототипа',limitationsText:'Это не синхронный сбор голосов с нескольких устройств. Хранилище локальных файлов зависит от браузера и расположения файла. Очистка браузера может удалить ответы. Пароля нет: используйте устройство под наблюдением исследователя. Анонимная локальная сессия не проверяет уникальность людей. Обращайтесь с экспортированными копиями ответственно.',liveTag:'LIVE EXPERIMENT',liveTitle:'Насколько независимым<br>был наш выбор?',liveSub:'Один вопрос. Два интерфейса. Общее размышление об автономии.',liveParticipants:'ЗАВЕРШЁННЫХ УЧАСТНИКОВ',liveQuote:'Автономия начинается с внимания к условиям нашего выбора.',liveAttribution:'Тезис проекта · по мотивам идей Канта и Фуко',reveal:'Раскрыть эксперимент',liveReveal:'ЧТО, ЕСЛИ ВАШ ВЫБОР НИКОГДА НЕ БЫЛ ПО-НАСТОЯЩЕМУ ВАШИМ?',liveExplain:'Один вопрос был показан в двух оформлениях. В группе B библиотеку выделили и добавили непроверенную подсказку «Популярный выбор». Сравнение побуждает задуматься, но не доказывает причины чьего-либо решения.',back:'Вернуться к результатам',fullscreen:'На весь экран',leaveFullscreen:'Выйти из полного экрана',backDashboard:'Панель',storageFailure:'Постоянное хранилище недоступно или переполнено. Изменения сейчас хранятся только в памяти. Экспортируйте копию JSON и не закрывайте вкладку.',corrupt:'Не удалось безопасно прочитать сохранённые данные. Импорт и изменения приостановлены для их защиты. Экспортируйте копию для восстановления, затем используйте очистку каждого повреждённого набора.',recovery:'Копия для восстановления',importInvalid:'Некорректная копия. Нужен JSON версии 1 этого приложения: один помеченный набор, корректные уникальные завершённые записи (не более 10 000).',importTitle:'Импортировать копию?',importBody:'Набор из файла заменит соответствующий локальный набор. Другой набор останется без изменений. Доступ текущего участника к прежнему ответу завершится. Сначала экспортируйте копию.',imported:'Копия импортирована. Соответствующий набор заменён.',fileTooLarge:'Копия слишком велика (максимум 10 МБ).',unavailable:'Ответ больше недоступен. Попросите исследователя начать новую сессию.',savingFailed:'Не удалось сохранить изменение. Экспортируйте копию для восстановления.',participants:'участников',privacy:'Анонимно · добровольно · локально',noPersonal:'Не вводите личные данные.',sessionActive:'Незавершённую сессию можно продолжить.',resume:'Продолжить сессию',withdrawnTag:'ОТВЕТ УДАЛЁН',ownNotFound:'Вашего ответа больше нет в этом наборе.',testEnded:'Тест завершён.',footerProject:'Итоговый проект по философии',liveNoData:'Сравнения пока нет. Соберите завершённые ответы в обеих группах.',backupSource:'Набор данных',dataProtected:'Сначала восстановите сохранённые данные.',percentOf:'из',completed:'завершено',clearTest:'Завершить тест / новая реальная сессия'}
};
const KEY={real:'invisible-vote.real.v1',demo:'invisible-vote.demo.v1',session:'invisible-vote.session.v1',prefs:'invisible-vote.prefs.v1'};
const emptyDataset=()=>({version:1,rows:[],assignments:{A:0,B:0}});
const Store={memory:{},bad:new Set(),raw:{},volatile:false,
 read(key,fallback){if(this.volatile&&Object.prototype.hasOwnProperty.call(this.memory,key))return this.memory[key];try{const raw=localStorage.getItem(key);this.raw[key]=raw;if(raw===null)return fallback;return JSON.parse(raw);}catch(e){if(e instanceof SyntaxError){this.bad.add(key);return fallback;}this.volatile=true;return this.memory[key]??fallback;}},
 write(key,value){if(this.bad.has(key))throw Error('protected');this.memory[key]=value;try{localStorage.setItem(key,JSON.stringify(value));}catch(e){this.volatile=true;}showStorage();},
 dataset(kind){const d=this.read(KEY[kind],emptyDataset());try{return validateDataset(d,kind,false);}catch(e){this.bad.add(KEY[kind]);return emptyDataset();}},
 save(kind,d){this.write(KEY[kind],d);},
 recoverClear(kind){this.bad.delete(KEY[kind]);this.save(kind,emptyDataset());}
};
function validateRecord(r,kind,completedOnly=true){
 if(!r||typeof r!=='object'||Array.isArray(r))throw Error('row');
 if(typeof r.id!=='string'||!/^[a-zA-Z0-9_-]{8,90}$/.test(r.id)||!['A','B'].includes(r.group)||!['library','lounge'].includes(r.option)||!['complete','pending'].includes(r.status)||typeof r.synthetic!=='boolean'||r.synthetic!==(kind==='demo'))throw Error('fields');
 if(completedOnly&&r.status!=='complete')throw Error('unfinished');
 if(r.status==='complete'&&(!['yes','no','unsure'].includes(r.awareness)||!Number.isInteger(r.confidence)||r.confidence<1||r.confidence>5))throw Error('survey');
 if(r.status==='pending'&&(r.awareness!==null||r.confidence!==null))throw Error('pending');
 if(typeof r.reason!=='string'||r.reason.length>500)throw Error('reason');
 return {id:r.id,group:r.group,option:r.option,status:r.status,synthetic:r.synthetic,awareness:r.awareness,confidence:r.confidence,reason:r.reason};
}
function validateDataset(d,kind,completedOnly){
 if(!d||d.version!==1||!Array.isArray(d.rows)||d.rows.length>10000||!d.assignments||!['A','B'].every(g=>Number.isSafeInteger(d.assignments[g])&&d.assignments[g]>=0))throw Error('dataset');
 const rows=d.rows.map(r=>validateRecord(r,kind,completedOnly));const ids=new Set(rows.map(r=>r.id));if(ids.size!==rows.length)throw Error('duplicate');
 for(const g of ['A','B'])if(d.assignments[g]<rows.filter(r=>r.group===g).length)throw Error('counts');
 return {version:1,rows,assignments:{A:d.assignments.A,B:d.assignments.B}};
}
const state={lang:'en',view:'participant',tab:'overview',dataset:'real',liveReveal:false,session:null,test:null,draft:{awareness:'',confidence:'',reason:''}};
const prefs=Store.read(KEY.prefs,{});if(prefs&&['en','ru'].includes(prefs.lang))state.lang=prefs.lang;
// Preferences are disposable; never block participant data because of them.
if(Store.bad.has(KEY.prefs))Store.bad.delete(KEY.prefs);
function readSession(){const s=Store.read(KEY.session,null);if(!s)return null;if(typeof s.id==='string'&&/^[a-zA-Z0-9_-]{8,90}$/.test(s.id)&&['A','B'].includes(s.group)&&['vote','survey','reveal','withdrawn'].includes(s.stage))return {id:s.id,group:s.group,stage:s.stage};Store.bad.add(KEY.session);return null;}
state.session=readSession();Store.dataset('real');Store.dataset('demo');
const $=s=>document.querySelector(s),t=k=>COPY[state.lang][k]??k;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=> 'P_'+(globalThis.crypto?.randomUUID?.()??Array.from({length:24},()=>Math.floor(Math.random()*16).toString(16)).join(''));
const random=()=>{if(globalThis.crypto?.getRandomValues){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}return Math.random();};
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),4500);}
function showStorage(){const el=$('#storage-alert');if(!el)return;let msg=Store.bad.size?t('corrupt'):Store.volatile?t('storageFailure'):'';el.innerHTML=msg?esc(msg)+' <button class="btn secondary small" data-action="recovery">'+esc(t('recovery'))+'</button>':'';el.classList.toggle('hidden',!msg);}
function commitSession(s){Store.write(KEY.session,s);state.session=s;}
function activeSession(){return state.test??state.session;}
function saveActive(s){if(state.test)state.test=s;else commitSession(s);}
const Statistics={
 calculate(rows){const complete=rows.filter(r=>r.status==='complete');const out={total:complete.length,library:complete.filter(r=>r.option==='library').length};out.lounge=out.total-out.library;
 for(const g of ['A','B']){const rs=complete.filter(r=>r.group===g);const n=rs.length,lib=rs.filter(r=>r.option==='library').length;out[g]={n,lib,lounge:n-lib,rate:n?lib/n*100:null,confidence:n?rs.reduce((a,r)=>a+r.confidence,0)/n:null,awareness:Object.fromEntries(['yes','no','unsure'].map(a=>[a,rs.filter(r=>r.awareness===a).length]))};}
 out.delta=out.A.n&&out.B.n?out.B.rate-out.A.rate:null;return out;}
};
const Experiment={
 start(){if(Store.bad.size){toast(t('dataProtected'));return;}if(!$('#consent')?.checked)return;const d=Store.dataset('real');if(d.rows.length>=10000){toast(state.lang==='ru'?'Достигнут лимит 10 000 записей. Экспортируйте и начните новый набор.':'The 10,000-record limit was reached. Export and start a fresh dataset.');return;}const group=d.assignments.A===d.assignments.B?(random()<.5?'A':'B'):(d.assignments.A<d.assignments.B?'A':'B');d.assignments[group]++;Store.save('real',d);commitSession({id:uid(),group,stage:'vote'});state.draft={awareness:'',confidence:'',reason:''};render();},
 vote(option){const s=activeSession();if(!s||s.stage!=='vote'||!['library','lounge'].includes(option))return;const r={id:s.id,group:s.group,option,status:'pending',synthetic:false,awareness:null,confidence:null,reason:''};if(state.test){state.test.row=r;}else{const d=Store.dataset('real');if(Store.bad.size){toast(t('dataProtected'));return;}if(d.rows.some(r=>r.id===s.id))return;d.rows.push(r);Store.save('real',d);}saveActive({...s,stage:'survey'});render();},
 submit(){const s=activeSession();if(!s||s.stage!=='survey')return;captureDraft();const {awareness,confidence,reason}=state.draft;if(!['yes','no','unsure'].includes(awareness)||!['1','2','3','4','5'].includes(String(confidence))){toast(t('required'));return;}
 if(state.test){state.test.row={...state.test.row,awareness,confidence:Number(confidence),reason,status:'complete'};}else{const d=Store.dataset('real');const r=d.rows.find(r=>r.id===s.id);if(!r||r.status!=='pending'){toast(t('unavailable'));return;}Object.assign(r,{awareness,confidence:Number(confidence),reason,status:'complete'});Store.save('real',d);}saveActive({...activeSession(),stage:'reveal'});state.draft={awareness:'',confidence:'',reason:''};render();},
 async withdraw(){const s=activeSession();if(!s||s.stage==='withdrawn')return;const after=s.stage==='reveal';if(!await ask(t(after?'deleteTitle':'exitTitle'),t(after?'deleteBody':'exitBody')))return;
 if(!state.test){const d=Store.dataset('real');d.rows=d.rows.filter(r=>r.id!==s.id);Store.save('real',d);}saveActive({...s,stage:'withdrawn'});state.draft={awareness:'',confidence:'',reason:''};render();toast(t('deleted'));},
 async newSession(testGroup=null){const s=activeSession();if(s&&!await ask(t(testGroup?'testTitle':'next'),t('newSessionBody')))return;
 if(state.session?.stage==='survey'){const d=Store.dataset('real');d.rows=d.rows.filter(r=>r.id!==state.session.id||r.status==='complete');Store.save('real',d);}commitSession(null);state.test=testGroup?{id:uid(),group:testGroup,stage:'vote'}:null;state.draft={awareness:'',confidence:'',reason:''};state.view='participant';render();toast(t(testGroup?'testBanner':'started'));}
};
function captureDraft(){if($('#survey-form')){state.draft={awareness:$('input[name="awareness"]:checked')?.value??'',confidence:$('input[name="confidence"]:checked')?.value??'',reason:$('#reason').value.slice(0,500)};}}
function languageButtons(){return `<div class="language" role="group" aria-label="Language / Язык"><button data-action="language" data-value="en" class="${state.lang==='en'?'active':''}" aria-pressed="${state.lang==='en'}">EN</button><button data-action="language" data-value="ru" class="${state.lang==='ru'?'active':''}" aria-pressed="${state.lang==='ru'}">РУ</button></div>`;}
function brand(){return '<div class="brand"><span class="brandmark" aria-hidden="true"></span><span>THE INVISIBLE<br>VOTE</span></div>';}
function header(){return `<header class="header">${brand()}<div class="header-right"><span class="offline">${t('offline')}</span>${languageButtons()}</div></header>`;}
function footer(){return `<footer class="footer"><span>${t('localOnly')}</span><button class="btn quiet" data-action="research">${t('researchAccess')} <span aria-hidden="true">↗</span></button></footer>`;}
function progress(stage){const n=stage==='vote'?0:stage==='survey'?1:2;return `<ol class="progress">${['progress1','progress2','progress3'].map((k,i)=>`<li class="${i===n?'current':i<n?'done':''}" ${i===n?'aria-current="step"':''}>0${i+1} — ${t(k)}</li>`).join('')}</ol>`;}
function welcome(){return `<main class="wrap welcome" id="main"><section><span class="tag"><span class="dot"></span>${t('welcomeTag')}</span><h1 style="font-size:clamp(39px,4.7vw,67px);letter-spacing:-.06em">THE INVISIBLE<br><span class="accent-text">VOTE</span></h1><p class="lead">${t('subtitle')}</p><p class="intro muted">${t('intro')}</p><label class="consent"><input type="checkbox" id="consent"><span>${t('consent')}</span></label><button class="btn" id="start-button" data-action="start" disabled>${t('start')}<span class="arrow" aria-hidden="true">↗</span></button><div class="meta-row"><span>01 / ${t('duration')}</span><span>02 / ${t('anonymous')}</span></div></section><aside class="specimen" aria-label="${t('studyType')}"><div class="specimen-top"><span>THE INVISIBLE VOTE</span><span>FIELD STUDY / 01</span></div><h2 class="specimen-title">${t('specTitle')}</h2>${[1,2,3].map(i=>`<div class="route"><span class="num">0${i}</span><div><strong>${t('step'+i)}</strong><small>${t('step'+i+'desc')}</small></div></div>`).join('')}<p class="specimen-note"><span>${t('specNote')}</span><span aria-hidden="true">↗</span></p></aside></main>`;}
function voteScreen(s){return `<main class="participant" id="main">${progress('vote')}<p class="eyebrow muted">THE INVISIBLE VOTE / 01</p><h1>${t('voteTitle')}</h1><p class="sub">${t('voteSub')}</p><div class="choices">${['library','lounge'].map((o,i)=>{const featured=s.group==='B'&&o==='library';return `<article class="choice ${featured?'featured':'neutral'}"><div class="option-no"><span>${t('option')} 0${i+1}</span>${featured?`<span class="popular">${t('popular')}</span>`:''}</div><h2>${t(o)}</h2><p>${t(o+'Desc')}</p><button class="btn" data-action="vote" data-value="${o}" aria-label="${esc(t('select')+': '+t(o))}">${t('select')}<span aria-hidden="true">↗</span></button></article>`;}).join('')}</div><div class="participant-end"><span>${t('locked')}</span><button class="btn quiet small" data-action="withdraw">${t('exit')}</button></div></main>`;}
function radio(name,val,text,checked){return `<label class="radio-pill"><input type="radio" name="${name}" value="${val}" ${checked?'checked':''} required><span>${text}</span></label>`;}
function surveyScreen(){return `<main class="participant" id="main">${progress('survey')}<p class="eyebrow muted">THE INVISIBLE VOTE / 02</p><h1>${t('surveyTitle')}</h1><p class="sub">${t('surveySub')}</p><form id="survey-form" class="panel survey-panel"><fieldset><legend>01. ${t('q1')}</legend><div class="radio-row">${['yes','no','unsure'].map(a=>radio('awareness',a,t(a),state.draft.awareness===a)).join('')}</div></fieldset><fieldset><legend>02. ${t('q2')}</legend><div class="radio-row scale">${[1,2,3,4,5].map(n=>radio('confidence',n,n,Number(state.draft.confidence)===n)).join('')}</div><div class="scale-label"><span>1 · ${t('low')}</span><span>5 · ${t('high')}</span></div></fieldset><label for="reason" class="text-label">03. ${t('q3')}</label><span class="hint" id="reason-hint">${t('optional')}</span><textarea id="reason" maxlength="500" aria-describedby="reason-hint" placeholder="${t('reasonPlaceholder')}">${esc(state.draft.reason)}</textarea><button type="submit" class="btn" style="margin-top:22px">${t('submit')} <span aria-hidden="true">↗</span></button></form><div class="participant-end"><span>${t('privacy')}</span><button class="btn quiet small" data-action="withdraw">${t('exit')}</button></div></main>`;}
function philosophy(){return `<div class="two-col philosophy"><article class="panel"><p class="eyebrow">${t('kant')}</p><p>${t('kantText')}</p></article><article class="panel"><p class="eyebrow">${t('foucault')}</p><p>${t('foucaultText')}</p></article></div>`;}
function revealScreen(s){const exists=state.test||Store.dataset('real').rows.some(r=>r.id===s.id);return `<main class="participant" id="main">${progress('reveal')}<p class="eyebrow muted">${t('revealTag')}</p><h1 class="reveal-title">${t('revealTitle')}</h1><div class="reveal-copy"><p><strong>${t('revealIntro')}</strong></p><p>${t('revealBody')}</p><div class="notice">${t('cue')}</div></div>${philosophy()}<section class="panel"><h2 style="font-size:22px">${t('guide')}</h2><ol class="guide-list">${[1,2,3,4,5].map(i=>`<li>${t('tip'+i)}</li>`).join('')}</ol></section><h2 class="question-end">${t('endQuestion')}</h2><p class="muted" style="font-size:12px">${state.test?t('testSaved'):s.stage==='withdrawn'?t('deleted'):!exists?t('ownNotFound'):t('saved')}</p>${s.stage!=='withdrawn'&&exists?`<button class="btn danger" data-action="withdraw">${t('deleteOwn')}</button>`:''}</main>`;}
function participant(){const s=activeSession();return header()+(state.test?`<div class="test-banner">${t('testBanner')}</div>`:'')+(!s?welcome():s.stage==='vote'?voteScreen(s):s.stage==='survey'?surveyScreen():revealScreen(s))+footer();}
function datasetSwitch(){return `<div class="dataset-switch" role="group" aria-label="${t('backupSource')}">${['real','demo'].map(k=>`<button data-action="dataset" data-value="${k}" class="${state.dataset===k?'active':''}" aria-pressed="${state.dataset===k}">${t(k+'Data')}</button>`).join('')}</div>`;}
function badge(){return `<span class="tag ${state.dataset==='demo'?'synthetic':'real'}"><span class="dot"></span>${t(state.dataset==='demo'?'demoBadge':'realBadge')}</span>`;}
function side(){return `<aside class="sidebar"><p class="eyebrow">${t('researcher')}</p>${['overview','sessions','method'].map(k=>`<button class="side-link ${state.tab===k?'active':''}" data-action="tab" data-value="${k}">${t(k)}</button>`).join('')}<button class="side-link" data-action="live">${t('live')} ↗</button><button class="side-link" data-action="participant">${t('backStudy')} ↗</button><div class="sidebar-bottom">THE INVISIBLE VOTE<br>${t('footerProject')}<br><br>${t('localOnly')}</div></aside>`;}
const fmt=n=>n===null?'—':n.toLocaleString(state.lang==='ru'?'ru-RU':'en-US',{maximumFractionDigits:1,minimumFractionDigits:1});
function rateRow(g,s,confidence=false){const d=s[g],v=confidence?d.confidence:d.rate;return `<div class="bar-row"><span>${t('group')} ${g}</span><div class="bar-track" aria-hidden="true"><div class="bar-fill ${g==='B'?'b':''}" style="width:${v===null?0:confidence?v/5*100:v}%"></div></div><div class="bar-number">${v===null?'—':fmt(v)+(confidence?' / 5':'%')}<small>n = ${d.n}</small></div></div>`;}
function interpretation(s){if(s.delta===null)return t('noComparison');return (s.delta===0?t('equal'):Math.abs(s.delta)<5?t('similar'):s.delta>0?t('positive'):t('negative'))+' '+t('interpret');}
function overview(){const d=Store.dataset(state.dataset),s=Statistics.calculate(d.rows),rows=d.rows.filter(r=>r.status==='complete');const metrics=[['total',s.total],['groupA',s.A.n],['groupB',s.B.n],['libraryVotes',s.library],['loungeVotes',s.lounge]];const pending=d.rows.length-rows.length;
 return `<div class="page-heading"><div><p class="eyebrow muted">RESEARCH / OVERVIEW</p><h1>${t('dashTitle')}</h1><p class="muted">${t('dashSub')}</p></div>${datasetSwitch()}</div><div class="dataset-label">${badge()}<span class="muted" style="font-size:11px">${t(state.dataset==='demo'?'demoNote':'realNote')}${pending?` · ${pending} ${t('pending')}`:''}</span></div><div class="stats">${metrics.map(([k,n])=>`<article class="stat"><div class="label">${t(k)}</div><div class="value">${n}</div></article>`).join('')}</div><div class="charts"><section class="panel chart-panel"><div class="chart-head"><div><h2>${t('abTitle')}</h2><p>${t('abSub')}</p></div><span class="chart-index">01 / AB</span></div>${rateRow('A',s)}${rateRow('B',s)}<div class="delta"><span>${t('difference')}</span><strong>${s.delta===null?'—':(s.delta>0?'+':'')+fmt(s.delta)+' '+t('pp')}</strong></div></section><section class="panel chart-panel"><div class="chart-head"><div><h2>${t('awarenessTitle')}</h2><p>${t('awarenessSub')}</p></div><span class="chart-index">02 / AWARE</span></div><div class="awareness-row muted"><span></span><span>${t('group')} A · n = ${s.A.n}</span><span>${t('group')} B · n = ${s.B.n}</span></div>${['yes','no','unsure'].map(a=>`<div class="awareness-row"><span>${t(a)}</span>${['A','B'].map(g=>`<div class="awareness-value">${s[g].n?fmt(s[g].awareness[a]/s[g].n*100)+'%':'—'} <small>(${s[g].awareness[a]}/${s[g].n})</small><div class="bar-track" style="height:5px;margin-top:5px" aria-hidden="true"><div class="bar-fill ${g==='B'?'b':''}" style="width:${s[g].n?s[g].awareness[a]/s[g].n*100:0}%"></div></div></div>`).join('')}</div>`).join('')}</section><section class="panel chart-panel"><div class="chart-head"><div><h2>${t('confidenceTitle')}</h2><p>${t('confidenceSub')}</p></div><span class="chart-index">03 / SELF</span></div>${rateRow('A',s,true)}${rateRow('B',s,true)}</section><section class="panel chart-panel"><div class="chart-head"><div><h2>${t('distributionTitle')}</h2><p>${t('distributionSub')}</p></div><span class="chart-index">04 / VOTE</span></div>${['A','B'].map(g=>`<div class="bar-row"><span>${t('group')} ${g}</span><div class="bar-track" aria-hidden="true"><div class="bar-fill ${g==='B'?'b':''}" style="width:${s[g].rate??0}%"></div><div class="bar-fill lounge" style="width:${s[g].n?100-s[g].rate:0}%"></div></div><div class="bar-number">${s[g].lib} / ${s[g].lounge}<small>n = ${s[g].n}</small></div></div>`).join('')}<div class="legend"><span><i class="swatch"></i>${t('library')}</span><span><i class="swatch lounge"></i>${t('lounge')}</span></div><p class="muted" style="font-size:10px;margin:12px 0 0">${['A','B'].map(g=>`${t('group')} ${g}: ${s[g].n?fmt(s[g].rate)+'% / '+fmt(100-s[g].rate)+'%':'— / —'}`).join(' · ')}</p></section></div><div class="interpretation"><strong class="eyebrow">${t('interpretLabel')}</strong><br>${state.dataset==='demo'?'<strong>'+t('demoInterpret')+'</strong> ':''}${interpretation(s)}</div>${toolbar()}<section class="panel table-panel"><div class="table-heading"><h2>${t('responses')}</h2><span class="muted" style="font-size:11px">${rows.length} ${t('completed')}</span></div><div class="table-scroll"><table><thead><tr>${['id','group','choice','awareness','confidence','reason'].map(k=>`<th scope="col">${t(k)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td class="code">${esc(r.id)}</td><td><span class="group-pill">${r.group}</span></td><td>${t(r.option)}</td><td>${t(r.awareness)}</td><td>${r.confidence} / 5</td><td class="reason">${esc(r.reason)||'—'}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">${t('noData')}</td></tr>`}</tbody></table></div></section>`;
}
function toolbar(){return `<div class="toolbar"><button class="btn secondary small" data-action="refresh">↻ ${t('refresh')}</button><button class="btn secondary small" data-action="csv">↓ ${t('csv')}</button><button class="btn secondary small" data-action="json">↓ ${t('json')}</button><button class="btn secondary small" data-action="import">↑ ${t('import')}</button><button class="btn danger small" data-action="clear">${t('clear')}</button></div><div class="toolbar"><button class="btn small" data-action="generate">${t('generate')}</button><button class="btn secondary small" data-action="reset-demo">${t('resetDemo')}</button></div>`;}
function sessions(){return `<div class="page-heading"><div><p class="eyebrow muted">RESEARCH / SESSIONS</p><h1>${t('sessionTitle')}</h1><p class="muted">${t('sessionIntro')}</p></div></div><div class="controls-grid"><section class="panel"><p class="eyebrow muted">01 / ${t('participant')}</p><h2>${t('next')}</h2><p class="muted">${t('nextDesc')}</p><p class="muted">${t('newSessionBody')}</p><button class="btn" data-action="new-session">${t('next')} ↗</button></section><section class="panel"><p class="eyebrow muted">02 / A + B</p><h2>${t('testTitle')}</h2><p class="muted">${t('testDesc')}</p><div class="control-buttons"><button class="btn secondary" data-action="test" data-value="A">${t('testA')}</button><button class="btn secondary" data-action="test" data-value="B">${t('testB')}</button></div></section></div><div class="notice warning">${t('limitationsText')}</div>`;}
function method(){return `<div class="method"><p class="eyebrow muted">RESEARCH / PHILOSOPHY</p><h1 style="font-size:42px">${t('studyNotesTitle')}</h1><p>${t('methodIntro')}</p><div class="interpretation">${t('researchQuestion')}</div>${philosophy()}<h2>${t('designTitle')}</h2><p>${t('designText')}</p><h2>${t('ethicsTitle')}</h2><p>${t('ethicsText')}</p><h2>${t('questionsTitle')}</h2><ol>${[1,2,3].map(i=>`<li>${t('ethic'+i)}</li>`).join('')}</ol><h2>${t('limitationsTitle')}</h2><p>${t('limitationsText')}</p></div>`;}
function dashboard(){return header()+`<div class="workspace">${side()}<main class="dashboard" id="main">${state.tab==='overview'?overview():state.tab==='sessions'?sessions():method()}</main></div><input id="import-file" class="hidden" type="file" accept=".json,application/json">`;}
function live(){const d=Store.dataset(state.dataset),s=Statistics.calculate(d.rows);return `<main class="live" id="main"><div class="live-top">${brand()}<div class="header-right">${languageButtons()}<button class="btn secondary small" data-action="fullscreen">${t(document.fullscreenElement?'leaveFullscreen':'fullscreen')}</button><button class="btn secondary small" data-action="research">${t('backDashboard')} ↗</button></div></div>${state.liveReveal?`<section class="live-final"><p class="eyebrow reveal-kicker">${t('liveTag')} / ${t('revealTag')}</p><h1>${t('liveReveal')}</h1><p class="result-text">${t('liveExplain')}</p><div class="notice">${state.dataset==='demo'?t('demoInterpret')+' ':''}${interpretation(s)}</div><button class="btn secondary" style="align-self:start;margin-top:20px" data-action="live-back">${t('back')}</button></section>`:`<p class="eyebrow" style="margin-top:40px;color:#b9cbce">${t('liveTag')} / THE INVISIBLE VOTE</p><h1 class="live-title">${t('liveTitle')}</h1><p class="live-sub">${t('liveSub')}</p><div style="display:flex;flex-wrap:wrap;gap:18px;align-items:center">${badge()}${datasetSwitch()}</div><div class="live-grid"><div><div class="live-count">${s.total}</div><p class="eyebrow" style="margin-top:20px">${t('liveParticipants')}</p></div><section aria-label="${t('abTitle')}">${rateRow('A',s)}${rateRow('B',s)}<p class="muted">${t('difference')}: ${s.delta===null?'—':(s.delta>0?'+':'')+fmt(s.delta)+' '+t('pp')}</p></section></div><div class="live-quote"><div><p>${t('liveQuote')}</p><small class="muted">${t('liveAttribution')}</small></div><button class="btn" style="background:var(--accent);color:#193222" data-action="live-reveal">${t('reveal')} ↗</button></div>`}<p class="muted" style="font-size:11px;margin-top:35px">${t('localOnly')}</p></main>`;}
function render(focus=true){document.documentElement.lang=state.lang;document.title='The Invisible Vote';$('#app').innerHTML=state.view==='research'?dashboard():state.view==='live'?live():participant();showStorage();if(focus){const h=$('#main h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}window.scrollTo(0,0);}}
let modalPending=false;
function ask(title,body){if(modalPending)return Promise.resolve(false);modalPending=true;const previous=document.activeElement;return new Promise(resolve=>{const root=$('#dialog-root');root.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-body"><h2 id="dialog-title">${esc(title)}</h2><p id="dialog-body">${esc(body)}</p><div class="modal-actions"><button class="btn secondary" id="modal-cancel">${t('cancel')}</button><button class="btn" id="modal-confirm">${t('confirm')}</button></div></section></div>`;
 const close=value=>{root.innerHTML='';document.removeEventListener('keydown',key);modalPending=false;previous?.focus();resolve(value);};const key=e=>{if(e.key==='Escape'){e.preventDefault();close(false);}if(e.key==='Tab'){const first=$('#modal-cancel'),last=$('#modal-confirm');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}};document.addEventListener('keydown',key);$('#modal-cancel').onclick=()=>close(false);$('#modal-confirm').onclick=()=>close(true);$('#modal-cancel').focus();});}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast(t('exported'));}
const Backup={
 envelope(kind){const d=Store.dataset(kind);return {app:'the-invisible-vote',version:1,dataset:kind,synthetic:kind==='demo',exportedAt:new Date().toISOString(),data:{...d,rows:d.rows.filter(r=>r.status==='complete')}};},
 validate(obj){if(!obj||obj.app!=='the-invisible-vote'||obj.version!==1||!['real','demo'].includes(obj.dataset)||obj.synthetic!==(obj.dataset==='demo'))throw Error('backup');return {kind:obj.dataset,data:validateDataset(obj.data,obj.dataset,true)};},
 csvCell(value){let v=String(value??'');if(/^[\s\u0000-\u001f]*[=+\-@\t\r\n]/u.test(v)||/^[\t\r\n]/u.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';},
 csv(kind){const rows=Store.dataset(kind).rows.filter(r=>r.status==='complete');const headers=['dataset','synthetic','anonymous_id','group','selected_option','influence_awareness','confidence','reason'];return '\ufeff'+[headers,...rows.map(r=>[kind,r.synthetic,r.id,r.group,r.option,r.awareness,r.confidence,r.reason])].map(row=>row.map(this.csvCell).join(',')).join('\r\n');},
 async importFile(file){if(!file)return;if(file.size>10*1024*1024){toast(t('fileTooLarge'));return;}let parsed;try{parsed=this.validate(JSON.parse(await file.text()));}catch(e){toast(t('importInvalid'));return;}if(Store.bad.size){toast(t('dataProtected'));return;}if(!await ask(t('importTitle')+' · '+t(parsed.kind+'Data'),t('importBody')))return;
 Store.save(parsed.kind,parsed.data);if(parsed.kind==='real'){commitSession(null);state.test=null;state.draft={awareness:'',confidence:'',reason:''};}state.dataset=parsed.kind;render();toast(t('imported'));}
};
function demoDataset(){const d=emptyDataset();for(const group of ['A','B'])for(let i=0;i<20;i++)d.rows.push({id:'DEMO_'+uid(),group,option:random()<.5?'library':'lounge',status:'complete',synthetic:true,awareness:['yes','no','unsure'][Math.floor(random()*3)],confidence:1+Math.floor(random()*5),reason:['','Synthetic: study resources matter.','Synthetic: a place to meet friends.','Синтетический пример: важны удобные пространства.'][i%4]});d.assignments={A:20,B:20};return d;}
async function action(name,value){
 if(name==='language'){captureDraft();const consent=$('#consent')?.checked;state.lang=value;Store.write(KEY.prefs,{lang:value});render(false);if(consent&&$('#consent')){$('#consent').checked=true;$('#start-button').disabled=false;}return;}
 if(name==='research'){captureDraft();state.view='research';state.tab='overview';render();return;}
 if(name==='participant'){state.view='participant';render();return;}
 if(name==='tab'){state.tab=value;render();return;}
 if(name==='dataset'){state.dataset=value;render(false);return;}
 if(name==='live'){state.view='live';state.liveReveal=false;render();return;}
 if(name==='live-reveal'||name==='live-back'){state.liveReveal=name==='live-reveal';render();return;}
 if(name==='fullscreen'){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){toast(state.lang==='ru'?'Полный экран недоступен в этом браузере.':'Full screen is unavailable in this browser.');}render(false);return;}
 if(name==='start'){Experiment.start();return;}
 if(name==='vote'){Experiment.vote(value);return;}
 if(name==='withdraw'){await Experiment.withdraw();return;}
 if(name==='new-session'||name==='test'){if(Store.bad.size){toast(t('dataProtected'));return;}await Experiment.newSession(name==='test'?value:null);return;}
 if(name==='refresh'){render(false);toast(t('refreshed'));return;}
 if(name==='recovery'){const raw={};for(const key of Object.values(KEY))try{raw[key]=localStorage.getItem(key);}catch(e){raw[key]=Store.memory[key]??Store.raw[key]??null;}download(JSON.stringify({recoveryOnly:true,raw,memory:Store.memory},null,2),'invisible-vote-recovery.json','application/json');return;}
 if(name==='clear'||name==='reset-demo'){const kind=name==='reset-demo'?'demo':state.dataset;if(!await ask(t('clearTitle')+' · '+t(kind+'Data'),t('clearBody')))return;Store.recoverClear(kind);if(kind==='real'){Store.bad.delete(KEY.session);commitSession(null);state.test=null;}render();toast(t(name==='reset-demo'?'reset':'cleared'));return;}
 if(Store.bad.size){toast(t('dataProtected'));return;}
 if(name==='generate'){if(Store.dataset('demo').rows.length&&!await ask(t('generateTitle'),t('generateBody')))return;Store.save('demo',demoDataset());state.dataset='demo';render();toast(t('generated'));return;}
 if(name==='csv'){if(!Store.dataset(state.dataset).rows.some(r=>r.status==='complete')){toast(t('emptyExport'));return;}download(Backup.csv(state.dataset),'invisible-vote-'+state.dataset+'.csv','text/csv;charset=utf-8');return;}
 if(name==='json'){download(JSON.stringify(Backup.envelope(state.dataset),null,2),'invisible-vote-'+state.dataset+'.json','application/json');return;}
 if(name==='import'){$('#import-file').click();}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;action(b.dataset.action,b.dataset.value).catch(()=>toast(t('savingFailed')));});
document.addEventListener('change',e=>{if(e.target.id==='consent')$('#start-button').disabled=!e.target.checked;if(e.target.id==='import-file')Backup.importFile(e.target.files[0]).catch(()=>toast(t('savingFailed')));});
document.addEventListener('submit',e=>{if(e.target.id==='survey-form'){e.preventDefault();Experiment.submit();}});
window.addEventListener('storage',e=>{if(Object.values(KEY).includes(e.key)){captureDraft();state.session=readSession();render(false);}});
document.addEventListener('fullscreenchange',()=>{if(state.view==='live')render(false);});
// Reconcile a refresh between a durable vote write and session-stage write.
if(state.session){const r=Store.dataset('real').rows.find(r=>r.id===state.session.id);if(r&&state.session.stage!=='withdrawn')state.session.stage=r.status==='complete'?'reveal':'survey';}
render(false);
</script>
</body>
</html>
